</div><div id="toast" class="toast"></div>
<script src="data-v26.js"></script><script src="common-v26.js"></script><script>
const ORDER=['ser','tener','estar','jugar','dibujar','cantar','trabajar','bailar','estudiar','saltar','comer','beber','leer','aprender','vivir','escribir'];
const PRON=['yo','tú','él / ella / Ud.','nosotros/as','vosotros/as','ellos / Uds.'];
const ENDINGS={1:['o','as','a','amos','áis','an'],2:['o','es','e','emos','éis','en'],3:['o','es','e','imos','ís','en']};
function formMarkup(t,w,i){
  const endings=ENDINGS[t.conjugation];if(!endings)return w.form;
  const e=endings[i]||'';if(!e||!w.form.endsWith(e))return w.form;
  return w.form.slice(0,-e.length)+`<span class="verb-ending">${e}</span>`;
}
function infinitiveMarkup(t){
  const inf=t.infinitive||t.id;
  if(!t.conjugation||inf.length<3)return inf;
  const ending=inf.slice(-2),stem=inf.slice(0,-2);
  return `${stem}<span class="infinitive-ending">${ending}</span>`;
}
const SEEN_CONJ=new Set();
const CONJ_NAMES={1:'1-е спряжение · -ar',2:'2-е спряжение · -er',3:'3-е спряжение · -ir'};
function row(t){
  const forms=t.words.slice(0,6);
  const conjClass=t.conjugation?`conj-${t.conjugation}`:'conj-main';
  let group='';
  if(t.conjugation&&!SEEN_CONJ.has(t.conjugation)){
    SEEN_CONJ.add(t.conjugation);
    group=`<div class="conj-section-marker ${conjClass}" id="conj-${t.conjugation}"><span>${CONJ_NAMES[t.conjugation]}</span></div>`;
  }
  return `${group}<article class="all-verb-row ${conjClass}"><div class="all-verb-left"><span class="verb-overview-badge">${t.conjugation?`${t.conjugation} спряжение`:'основной'}</span><h2>${infinitiveMarkup(t)}</h2><p>${t.infinitiveRu||t.title}</p><a href="trainer.html?topic=${t.id}&mode=verbOverview">Открыть изучение →</a></div><div class="all-verb-forms">${forms.map((w,i)=>`<div class="all-verb-form"><small>${PRON[i]}</small><b>${formMarkup(t,w,i)}</b></div>`).join('')}</div></article>`;
}
document.querySelector('#allVerbs').innerHTML=ORDER.map(id=>TOPICS[id]).filter(Boolean).map(row).join('');
</script></body></html>
