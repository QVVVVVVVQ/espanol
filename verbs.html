<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Глаголы — Español</title><link rel="stylesheet" href="styles-v20.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f5f3ee"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Espanol"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script></head><body>
<div class="shell"><header class="appbar"><div class="appbar-left"><a class="ghostbtn back" href="index.html">←</a><div class="logo">E</div><div class="appbar-title"><h1>Глаголы</h1><small>школьный тренажёр · версия 20</small></div></div><div class="appbar-actions"><a class="iconbtn" href="pronunciation.html">🗣 Произношение</a><a class="iconbtn" href="settings.html">⚙ Настройки</a></div></header>
<h1 class="page-title">Глаголы</h1><p class="page-sub">Выбери глагол. SER, TENER и ESTAR остаются отдельными темами со своим прогрессом.</p>
<div class="folder-back-note">📁 <a href="index.html">Главная</a><span>›</span><b>Глаголы</b></div>
<section class="verb-folder-grid" id="verbCards"></section>
<details class="nested-folder" id="practiceFolder"><summary><span class="nested-folder-icon">📁</span><span><b>Практика глаголов</b><small>8 выражений с TENER и ESTAR</small></span><span class="nested-folder-arrow">⌄</span></summary><div class="nested-folder-content" id="practiceCard"></div></details>
</div><div id="toast" class="toast"></div>
<script src="data-v20.js"></script><script src="common-v20.js"></script><script>
function card(t){if(!t)return '';const ss=statsSummary(t),act=activeWords(t).length;return `<a class="topic-card" href="trainer.html?topic=${t.id}"><div class="topic-icon">${t.icon}</div><h2>${t.title}</h2><p>${t.description}</p><div class="topic-meta"><span><b>${act}</b> активно</span><span><b>${ss.learned}</b> изучено</span></div><div class="topic-cta">Открыть →</div></a>`;}
const verbs=['ser','tener','estar'].map(id=>TOPICS[id]).filter(Boolean);document.querySelector('#verbCards').innerHTML=verbs.map(card).join('')||'<div class="empty"><h2>Глаголы загружаются</h2><p class="subtle">Обнови страницу один раз.</p></div>';
const practice=TOPICS.verb_practice;document.querySelector('#practiceCard').innerHTML=practice?card(practice):'<div class="empty"><p class="subtle">Практика появится после обновления данных приложения.</p></div>';
</script></body></html>
