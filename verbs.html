<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Español — Глаголы</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f5f3ee"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Espanol"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script></head><body>
<div class="shell">
  <header class="appbar"><div class="appbar-left"><a class="back" href="index.html">←</a><div class="logo">E</div><div class="appbar-title"><h1>Глаголы</h1><small>школьный тренажёр · версия 18</small></div></div><div class="appbar-actions"><a class="iconbtn" href="pronunciation.html">🗣 Произношение</a><a class="iconbtn" href="settings.html">⚙ Настройки</a></div></header>
  <h1 class="page-title">Глаголы</h1>
  <p class="page-sub">Выбери глагол. Каждый блок хранит собственный прогресс и использует все режимы тренажёра.</p>
  <section class="verb-folder-grid" id="verbCards"></section>
  <details class="nested-folder" id="verbPracticeFolder">
    <summary><span class="nested-folder-icon">📁</span><span><b>Практика глаголов</b><small>Полезные выражения с TENER и ESTAR</small></span><span class="nested-folder-arrow">⌄</span></summary>
    <div class="nested-folder-content" id="practiceCard"></div>
  </details>
</div><div id="toast" class="toast"></div>
<script src="data.js"></script><script src="common.js"></script><script>
function card(t){
  const ss=statsSummary(t),act=activeWords(t).length;
  return `<a class="topic-card" href="trainer.html?topic=${t.id}"><div class="topic-icon">${t.icon}</div><h2>${t.title}</h2><p>${t.description}</p><div class="topic-meta"><span><b>${act}</b> активно</span><span><b>${ss.learned}</b> изучено</span></div><div class="topic-cta">Открыть →</div></a>`;
}
document.querySelector('#verbCards').innerHTML=['ser','tener','estar'].map(id=>card(TOPICS[id])).join('');
document.querySelector('#practiceCard').innerHTML=card(TOPICS.verb_practice);
</script></body></html>
