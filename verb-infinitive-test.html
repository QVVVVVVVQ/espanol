<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Тест глаголов — Español</title><link rel="stylesheet" href="styles-v27.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f5f3ee"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Espanol"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script></head><body>
<div class="shell">
<header class="appbar"><div class="appbar-left"><a class="ghostbtn back" href="verbs.html">←</a><div class="logo">E</div><div class="appbar-title"><h1>Тест глаголов</h1><small>школьный тренажёр · версия 27</small></div></div><div class="appbar-actions"><a class="iconbtn" href="all-verbs.html">📋 Все глаголы</a><a class="iconbtn" href="settings.html">⚙ Настройки</a></div></header>
<div class="folder-back-note">📁 <a href="index.html">Главная</a><span>›</span><a href="verbs.html">Глаголы</a><span>›</span><b>Тест инфинитивов</b></div>
<main class="verb-inf-test-shell">
  <section class="verb-inf-test-head">
    <div><span class="verb-overview-badge">Русский → Español</span><h1>Выбери испанский глагол</h1><p>Для каждого русского глагола показано 6 вариантов на испанском. Ошибка не меняет вопрос — попробуй ещё раз.</p></div>
    <div class="verb-inf-counter" id="counter">0 / 0</div>
  </section>
  <div class="progress verb-inf-progress"><div id="verbInfProgress"></div></div>
  <section class="verb-inf-question" id="question"></section>
</main>
</div><div id="toast" class="toast"></div>
<script src="data-v27.js"></script><script src="common-v27.js"></script><script>
const VERB_IDS=['ser','tener','estar','jugar','dibujar','cantar','trabajar','bailar','estudiar','saltar','comer','beber','leer','aprender','vivir','escribir'];
const VERBS=VERB_IDS.map(id=>TOPICS[id]).filter(t=>t&&t.kind==='verb'&&t.infinitive);
const question=document.querySelector('#question'),counter=document.querySelector('#counter'),progress=document.querySelector('#verbInfProgress');
let deck=[],position=0,current=null,locked=false;

function freshDeck(){
  deck=shuffle(VERBS);
  position=0;
}
function nextVerb(){
  if(!deck.length||position>=deck.length)freshDeck();
  current=deck[position++];
  renderQuestion();
}
function makeInfinitiveOptions(target){
  const others=shuffle(VERBS.filter(v=>v.id!==target.id)).slice(0,5);
  return shuffle([target,...others]);
}
function conjugationClass(t){return t.conjugation?`conj-${t.conjugation}`:'conj-main'}
function infinitiveMarkup(t){
  const inf=t.infinitive||t.id;
  if(!t.conjugation||inf.length<3)return inf;
  const ending=inf.slice(-2),stem=inf.slice(0,-2);
  return `${stem}<span class="infinitive-ending">${ending}</span>`;
}
function renderQuestion(){
  locked=false;
  const opts=makeInfinitiveOptions(current);
  const shown=Math.min(position,VERBS.length);
  counter.textContent=`${shown} / ${VERBS.length}`;
  progress.style.width=`${Math.round((shown-1)/VERBS.length*100)}%`;
  question.innerHTML=`<div class="verb-inf-prompt">
    <span class="subtle">Как будет по-испански?</span>
    <div class="verb-inf-russian">${current.infinitiveRu||current.title}</div>
    <span class="verb-inf-note">выбери один из шести инфинитивов</span>
  </div>
  <div class="verb-inf-options">${opts.map(v=>`<button type="button" class="verb-inf-option ${conjugationClass(v)}" data-id="${v.id}">${infinitiveMarkup(v)}</button>`).join('')}</div>
  <div class="feedback verb-inf-feedback" id="feedback"></div>`;
  document.querySelectorAll('.verb-inf-option').forEach(btn=>btn.onclick=()=>answer(btn));
}
function answer(btn){
  if(locked)return;
  const ok=btn.dataset.id===current.id;
  const feedback=document.querySelector('#feedback');
  if(!ok){
    wrongSignal();
    register(current,false);
    btn.classList.add('wrong');
    feedback.textContent='Неверно. Попробуй ещё раз.';
    feedback.className='feedback bad verb-inf-feedback';
    setTimeout(()=>btn.classList.remove('wrong'),430);
    return;
  }
  locked=true;
  register(current,true);
  document.querySelectorAll('.verb-inf-option').forEach(x=>x.disabled=true);
  btn.classList.add('correct');
  feedback.textContent=`¡Muy bien! ${current.infinitive}`;
  feedback.className='feedback ok verb-inf-feedback';
  progress.style.width=`${Math.round(position/VERBS.length*100)}%`;
  speak(current.infinitive,()=>setTimeout(nextVerb,280));
}
if(!VERBS.length){
  question.innerHTML='<div class="empty"><h2>Глаголы не найдены</h2><p class="subtle">Обнови приложение до последней версии.</p></div>';
}else{
  freshDeck();
  nextVerb();
}
</script></body></html>
