<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Настройки — Español</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#f5f3ee"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Espanol"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script></head><body>
<div class="shell"><header class="appbar"><div class="appbar-left"><a class="ghostbtn back" href="index.html">←</a><div class="appbar-title"><h1>Настройки</h1><small>словарь, грамматика и произношение</small></div></div></header>
<h1 class="page-title">Справочник</h1><p class="page-sub">Включай только тот материал, который хочешь видеть в упражнениях. Настройка отдельная для каждой темы.</p>
<section class="settings-card"><h2>🔊 Произношение</h2><p>Настройка используется во всех темах.</p><label class="subtle">Испанский голос</label><select id="voiceSelect" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:6px 0 10px"></select><label class="subtle">Скорость: <b id="rateLabel"></b></label><input id="rate" type="range" min=".65" max="1.15" step=".05" style="width:100%"><label class="check" style="margin-top:12px"><input id="auto" type="checkbox"> автоматически произносить карточки</label></section>
<div id="topicSettings"></div>
<section class="settings-card"><h2>Статистика</h2><p>Можно сбросить результаты, не меняя активный материал.</p><button class="btn warn" id="resetStats">Сбросить всю статистику</button></section>
</div><div id="toast" class="toast"></div>
<script src="data.js"></script><script src="common.js"></script><script>
const box=document.querySelector('#topicSettings');
function rowVisual(t,w){if(t.id==='colors')return `<span class="dot" style="background:${w.hex}"></span>`;if(t.id==='ser')return `<span class="grammar-chip">${w.pronoun}</span>`;return `<span class="dot text-dot">${w.symbol||t.icon}</span>`}
function rowTitle(t,w){return t.id==='ser'?`${w.pronoun} — ${w.form}`:w.es}
function rowSub(t,w){return t.id==='ser'?`${w.ru} · ${w.exampleEs}`:(w.hint?`${w.hint} · ${w.ru}`:w.ru)}
function render(){box.innerHTML=Object.values(TOPICS).map(t=>{const activeSet=STATE.settings.active[t.id];return `<section class="settings-card" id="${t.id}"><h2>${t.icon} ${t.title}</h2><p><b>${activeSet.length}</b> из ${t.words.length} карточек активно</p><div class="settings-actions"><button class="btn soft all" data-topic="${t.id}">Включить все</button><button class="btn soft none" data-topic="${t.id}">Выключить все</button><a class="ghostbtn" href="trainer.html?topic=${t.id}">Открыть тему →</a></div><div class="dict-list">${t.words.map(w=>{const on=activeSet.includes(w.es);return `<div class="word-row ${on?'':'off'}"><label class="switch"><input class="toggle" type="checkbox" data-topic="${t.id}" data-word="${w.es}" ${on?'checked':''}><span class="slider"></span></label>${rowVisual(t,w)}<span class="word-main"><b>${rowTitle(t,w)}</b><span>${rowSub(t,w)}</span></span><button class="iconbtn say" data-topic="${t.id}" data-word="${w.es}">🔊</button></div>`}).join('')}</div></section>`}).join('');
  document.querySelectorAll('.toggle').forEach(x=>x.onchange=()=>{const arr=STATE.settings.active[x.dataset.topic],w=x.dataset.word;if(x.checked&&!arr.includes(w))arr.push(w);if(!x.checked)STATE.settings.active[x.dataset.topic]=arr.filter(v=>v!==w);saveState();render();scrollBack(x.dataset.topic)});
  document.querySelectorAll('.all').forEach(b=>b.onclick=()=>{const t=TOPICS[b.dataset.topic];STATE.settings.active[t.id]=t.words.map(w=>w.es);saveState();render();scrollBack(t.id)});
  document.querySelectorAll('.none').forEach(b=>b.onclick=()=>{STATE.settings.active[b.dataset.topic]=[];saveState();render();scrollBack(b.dataset.topic)});
  document.querySelectorAll('.say').forEach(b=>b.onclick=()=>{const t=TOPICS[b.dataset.topic],w=t.words.find(x=>x.es===b.dataset.word);speak(t.id==='ser'?(w.audio||`${w.pronoun} ${w.form}`):w.es)})
}
function scrollBack(id){requestAnimationFrame(()=>document.querySelector('#'+id)?.scrollIntoView({block:'nearest'}))}
const vs=loadVoices(),sel=document.querySelector('#voiceSelect');if(vs.length){sel.innerHTML=vs.map((v,n)=>`<option value="${n}">${v.name} — ${v.lang}</option>`).join('');let ix=vs.indexOf(voice);if(ix<0)ix=0;sel.value=ix;sel.onchange=()=>{voice=vs[+sel.value];STATE.settings.voiceURI=voice?.voiceURI||'';saveState();speak('Hola')}}else{sel.innerHTML='<option>Системный голос es-ES</option>';sel.disabled=true}
const rate=document.querySelector('#rate');rate.value=STATE.settings.rate;document.querySelector('#rateLabel').textContent=Number(STATE.settings.rate).toFixed(2)+'×';rate.oninput=e=>{STATE.settings.rate=+e.target.value;document.querySelector('#rateLabel').textContent=Number(STATE.settings.rate).toFixed(2)+'×';saveState()};document.querySelector('#auto').checked=STATE.settings.autoSpeak;document.querySelector('#auto').onchange=e=>{STATE.settings.autoSpeak=e.target.checked;saveState()};
document.querySelector('#resetStats').onclick=()=>{if(confirm('Сбросить статистику по всем темам?')){Object.values(TOPICS).forEach(t=>STATE.stats[t.id]={learned:[],correct:0,total:0,streak:0,bestStreak:0,studyIndex:0});saveState();toast('Статистика сброшена')}};
render();const focus=new URLSearchParams(location.search).get('topic');if(focus)setTimeout(()=>document.querySelector('#'+focus)?.scrollIntoView({behavior:'smooth'}),80);
</script></body></html>
